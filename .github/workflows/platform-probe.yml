# Platform probe for PR #4070 (reserved_keywords fixture).
#
# Scratch-branch only. Trigger is a push to `ci/platform-probe-0813`; this file
# must never land on `fix/python-reserved-keywords` or on the default branch.
#
# Deliberate differences from upstream's cargo-tests.reusable.yaml:
#   - plain GitHub-hosted labels, NOT blacksmith-* (the fork has no Blacksmith).
#   - no mise, no direnv, no sccache, no .envrc. Those are the paths that need
#     BAML_SCCACHE_R2_* and that drag in `npm:@infisical/cli`. Zero secrets are
#     referenced anywhere in this file.
#   - toolchain comes from `rustup show` reading rust-toolchain.toml (1.93.0),
#     exactly as upstream does; cargo-nextest and wasm-pack come from
#     taiki-e/install-action (upstream's own pre-mise mechanism).
#   - every test step swallows its exit code into probe-out/exit/<name>.txt and
#     always exits 0, so one failing cell can never cancel the rest of the leg.
#     Nothing in this workflow reports pass/fail; it only records exit codes.
#
# Revision 2 (2026-08-14) closes the two coverage gaps left by run 31695117485:
#   1. macOS python_pydantic2. Revision 1 dropped it for time budget, but
#      upstream's own matrix DOES schedule python-pydantic2 on macos, so this
#      was the one genuine gap against what upstream CI will run. Measured wall
#      time for that job in run 31695117485 was 34.8 min against a 360 min cap,
#      so the budget reason no longer holds.
#   2. Windows C++. The cell died in 0.24s in run 31695117485 because the
#      fixture driver is spawned as a bare `Command::new("bash")` from
#      sdk_tests/harness_runner, which inherits the machine PATH, and
#      C:\Windows\System32\bash.exe (the WSL launcher) sits ahead of Git Bash
#      there. windows-latest has no WSL distribution installed, so that bash
#      exits immediately. Revision 2 locates a real Git Bash on the runner
#      (it does not assume the path), records what it found, and puts that
#      directory first on PATH for the C++ step only.
#      Note the fixture driver already anticipates Git Bash: its `uname -s`
#      case arm matches MSYS*/MINGW*/CYGWIN* and picks bridge_cffi.dll.
#      Windows C++ is still a BONUS, not a gap: upstream's matrix has no cpp
#      cell on windows at all.
#
# Revision 3 (2026-08-15) is one more attempt at the Windows C++ cell, aimed
# at the mechanism revision 2 MEASURED rather than at the one it assumed.
# Revision 2's PATH prepend was proven not to matter: a native child does not
# search PATH until after the Windows system directory, so C:\Windows\System32
# \bash.exe (the WSL launcher) always won. Revision 3 changes three things and
# touches no cell that passes today:
#   1. A native launcher named bash.exe is built into target/debug/deps, the
#      directory of the nextest test binary, which rustc's resolver searches
#      BEFORE the system directory. It forwards to the real Git Bash by
#      absolute path. A canary compiled into the same directory measures the
#      resolution before and after and gates the C++ cell. Windows leg only.
#   2. The pinned protobuf/abseil sources are created and validated, on ALL
#      THREE legs (Option W of the design). Windows needs them created at all:
#      setup.ps1, which is what nextest runs there, does not clone them the way
#      setup.sh does, and the generated test.sh points cmake at them
#      unconditionally. macOS and ubuntu need the other half, the invariant
#      "exists AND has a CMakeLists.txt", because setup.sh's own guard is
#      `[[ -d ]]` and run 31797094469 lost four C++ cells (exit 105) to gutted
#      directories that guard accepted. Those four cells fail today, so this
#      widening still touches nothing that passes.
#   3. A contingency for the multi-config output layout that only fires if the
#      run cell actually reaches the exec path. Windows leg only.
# Nothing here reports pass/fail; it still only records exit codes.

name: platform probe

on:
  push:
    branches:
      - ci/platform-probe-0813

permissions:
  contents: read

concurrency:
  group: platform-probe-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "10"
  RUSTUP_MAX_RETRIES: "10"
  # The workspace depends on large git forks (minijinja, aws-sdk-rust,
  # google-cloud-rust). Shelling out to git is far faster and far less
  # memory-hungry than cargo's built-in fetcher on those.
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  # Upstream's own runtime/disk tuning, copied verbatim in intent.
  CARGO_PROFILE_DEV_OPT_LEVEL: "1"
  CARGO_PROFILE_TEST_OPT_LEVEL: "1"
  CARGO_PROFILE_DEV_DEBUG: "line-tables-only"
  CARGO_PROFILE_TEST_DEBUG: "line-tables-only"
  RUST_BACKTRACE: "1"
  BAML_TELEMETRY_ENV: internal

jobs:
  probe:
    name: "probe (${{ matrix.label }})"
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macos
            os: macos-latest
            pkgs: "-p sdk_test_swift -p sdk_test_cpp -p sdk_test_typescript -p sdk_test_typescript_web -p sdk_test_rust -p sdk_test_python_pydantic2"
          - label: windows
            os: windows-latest
            pkgs: "-p sdk_test_swift -p sdk_test_typescript -p sdk_test_typescript_web -p sdk_test_rust -p sdk_test_python_pydantic2 -p sdk_test_cpp"
          - label: ubuntu
            os: ubuntu-latest
            pkgs: "-p sdk_test_swift -p sdk_test_cpp -p sdk_test_typescript -p sdk_test_typescript_web -p sdk_test_rust -p sdk_test_python_pydantic2"
    runs-on: ${{ matrix.os }}
    # Outer bound (GitHub's per-job maximum for hosted runners; 360 cannot be
    # raised). Every step below carries its own timeout, so a hang costs that
    # step's budget, not the job's.
    #
    # Nominal worst case (sum of per-step caps) after revision 3 with Option W,
    # i.e. with the pinned-cpp-sources step (cap 8) running on all three legs,
    # and with the build step trimmed from 85 to 81 so every leg lands strictly
    # under the un-raisable 360:
    #   macos   359  (was 363 before the build-cap trim; revision 2 was 355)
    #   windows 349  (was 353 before the build-cap trim; revision 2 was 340,
    #                 +8 pinned cpp sources, +5 bash launcher and canary)
    #   ubuntu  329  (was 333 before the build-cap trim; revision 2 was 325)
    # Option W's +8 pinned-cpp-sources cap had pushed the macos sum to 363, i.e.
    # 3 over the job cap, so the build cap comes down by 4 to 81 and macos now
    # sums to 359. That is arithmetic headroom, not a schedule change: the build
    # step is the one cap with the most slack against measurement, and 81 min is
    # still more than twice the measured macos wall time for the entire job.
    # Those are caps that would all have to be hit at once. Measured wall time
    # in run 31695117485, on a completely cold cache (that run was the only run
    # this fork has ever had), was macos 34.8, windows 56.6, ubuntu 36.3 min.
    # The python cap is 25 because the two legs that actually ran it measured
    # 9.2 min (ubuntu) and 8.2 min (windows). The Windows cpp cap is 40 because
    # revision 1 never got past `bash`, so that cell has no measurement at all
    # and it has to configure and build protobuf + abseil + the SDK under MSVC.
    #
    # A step that hits its own timeout writes NO exit file: a missing entry in
    # the summary means "timed out or skipped", never "passed".
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: "Record runner identity"
        if: always()
        timeout-minutes: 5
        run: |
          set +e
          mkdir -p probe-out/exit probe-out/log
          {
            echo "matrix-label:    ${{ matrix.label }}"
            echo "runs-on:         ${{ matrix.os }}"
            echo "RUNNER_OS:       ${RUNNER_OS}"
            echo "RUNNER_ARCH:     ${RUNNER_ARCH}"
            echo "ImageOS:         ${ImageOS}"
            echo "ImageVersion:    ${ImageVersion}"
            echo "uname -m:        $(uname -m)"
            echo "uname -s:        $(uname -s)"
            echo "uname -a:        $(uname -a)"
          } > probe-out/platform.txt
          case "${RUNNER_OS}" in
            macOS)
              sw_vers >> probe-out/platform.txt
              echo "xcode: $(xcodebuild -version 2>&1 | tr '\n' ' ')" >> probe-out/platform.txt
              echo "swift: $(swift --version 2>&1 | tr '\n' ' ')" >> probe-out/platform.txt
              echo "cmake: $(cmake --version 2>&1 | head -1)" >> probe-out/platform.txt
              ;;
            Linux)
              cat /etc/os-release >> probe-out/platform.txt
              echo "cmake: $(cmake --version 2>&1 | head -1)" >> probe-out/platform.txt
              echo "gcc:   $(gcc --version 2>&1 | head -1)" >> probe-out/platform.txt
              ;;
            Windows)
              cmd //c ver >> probe-out/platform.txt
              echo "PROCESSOR_ARCHITECTURE: ${PROCESSOR_ARCHITECTURE}" >> probe-out/platform.txt
              echo "cmake: $(cmake --version 2>&1 | head -1)" >> probe-out/platform.txt
              echo "bash:  $(bash --version 2>&1 | head -1)" >> probe-out/platform.txt
              ;;
          esac
          cat probe-out/platform.txt
          exit 0

      # Windows only. Find out, rather than assume, which `bash` a NATIVE child
      # process would get. `shell: bash` already gives THIS step Git Bash, but
      # sdk_tests/harness_runner spawns `Command::new("bash")`, and that goes
      # through CreateProcess against the machine PATH, where
      # C:\Windows\System32\bash.exe (WSL) normally wins. This step records the
      # full resolution order and exports the Git Bash directory in MSYS form
      # (/c/Program Files/Git/bin, never C:/... which would be ambiguous inside
      # a colon-separated PATH) for the C++ step to prepend. If no Git Bash is
      # found it exports nothing and says so; nothing downstream is faked.
      - name: "windows: locate Git Bash (verify, do not assume)"
        if: always() && matrix.label == 'windows'
        timeout-minutes: 5
        run: |
          set +e
          mkdir -p probe-out/exit probe-out/log
          out=probe-out/log/windows-bash-resolution.txt
          {
            echo "--- where.exe bash (machine PATH order, what CreateProcess sees) ---"
            where.exe bash 2>&1
            echo ""
            echo "--- where.exe sh ---"
            where.exe sh 2>&1
            echo ""
            echo "--- candidate Git Bash locations ---"
            for c in "/c/Program Files/Git/bin" \
                     "/c/Program Files/Git/usr/bin" \
                     "/c/Program Files (x86)/Git/bin"; do
              if [ -f "${c}/bash.exe" ]; then
                echo "PRESENT  ${c}/bash.exe"
                echo "         $("${c}/bash.exe" --version 2>&1 | head -1)"
              else
                echo "ABSENT   ${c}/bash.exe"
              fi
            done
            echo ""
            echo "--- WSL launcher ---"
            if [ -f "/c/Windows/System32/bash.exe" ]; then
              echo "PRESENT  C:/Windows/System32/bash.exe (WSL launcher)"
            else
              echo "ABSENT   C:/Windows/System32/bash.exe"
            fi
            echo ""
            echo "--- this step's own shell ---"
            echo "BASH=${BASH}"
            echo "uname -s=$(uname -s)"
          } > "${out}" 2>&1
          cat "${out}"

          gitbash=""
          for c in "/c/Program Files/Git/bin" \
                   "/c/Program Files/Git/usr/bin" \
                   "/c/Program Files (x86)/Git/bin"; do
            if [ -f "${c}/bash.exe" ]; then gitbash="${c}"; break; fi
          done
          if [ -n "${gitbash}" ]; then
            echo "GIT_BASH_DIR=${gitbash}" >> "$GITHUB_ENV"
            echo "resolved GIT_BASH_DIR=${gitbash}" | tee -a "${out}"
            echo "0" > probe-out/exit/windows-bash-locate.txt
          else
            echo "no Git Bash found at any candidate path" | tee -a "${out}"
            echo "1" > probe-out/exit/windows-bash-locate.txt
          fi
          exit 0

      - name: "Install pinned Rust toolchain (rust-toolchain.toml)"
        working-directory: baml_language
        timeout-minutes: 15
        run: |
          for attempt in 1 2 3; do
            if rustup show; then break; fi
            echo "rustup show attempt ${attempt} failed; retrying"
            if [ "${attempt}" = 3 ]; then
              echo "::error::rustup show failed after 3 attempts"
              exit 1
            fi
            sleep 15
          done
          {
            echo "--- rust toolchain ---"
            rustup show active-toolchain
            rustc -vV
            cargo -V
          } >> ../probe-out/platform.txt
          cat ../probe-out/platform.txt

      - name: "Install cargo-nextest and wasm-pack"
        uses: taiki-e/install-action@v2
        timeout-minutes: 10
        with:
          tool: cargo-nextest,wasm-pack

      - name: "Install pnpm via npm (no corepack, no registry auth)"
        if: always()
        timeout-minutes: 10
        run: |
          set +e
          {
            echo "--- node/pnpm ---"
            echo "node: $(node -v 2>&1)"
            echo "npm:  $(npm -v 2>&1)"
          } >> probe-out/platform.txt
          npm install -g pnpm@9.12.0
          code=$?
          echo "pnpm: $(pnpm -v 2>&1)" >> probe-out/platform.txt
          echo "${code}" > probe-out/exit/install-pnpm.txt
          cat probe-out/platform.txt
          exit 0

      - name: "Install uv (astral official installer, no auth)"
        if: always()
        timeout-minutes: 10
        run: |
          set +e
          if [ "${RUNNER_OS}" = "Windows" ]; then
            powershell -NoProfile -ExecutionPolicy Bypass -Command "irm https://astral.sh/uv/install.ps1 | iex"
            code=$?
            echo "${USERPROFILE}\.local\bin" >> "$GITHUB_PATH"
          else
            curl -LsSf https://astral.sh/uv/install.sh | sh
            code=$?
            echo "${HOME}/.local/bin" >> "$GITHUB_PATH"
          fi
          echo "${code}" > probe-out/exit/install-uv.txt
          exit 0

      - name: "Restore/save cargo cache"
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "baml_language -> target"
          cache-all-crates: true
          cache-on-failure: true
          shared-key: "probe-${{ matrix.label }}"

      - name: "Fetch cargo dependencies"
        if: always()
        working-directory: baml_language
        timeout-minutes: 25
        run: |
          set +e
          mkdir -p ../probe-out/exit ../probe-out/log
          cargo fetch 2>&1 | tee ../probe-out/log/fetch.log
          code=${PIPESTATUS[0]}
          echo "${code}" > ../probe-out/exit/fetch.txt
          echo "fetch exit=${code}"
          exit 0

      # This step runs every selected sdk_test crate's build.rs, which is where
      # codegen happens. Even if the test-binary link later fails, the generated
      # SDK source for the reserved_keywords fixture exists on disk after this,
      # and the next step uploads it. That artifact is the highest-value output
      # of the whole run.
      - name: "Build sdk-test crates (runs build.rs codegen)"
        if: always()
        working-directory: baml_language
        timeout-minutes: 81
        run: |
          set +e
          cargo test --no-run --all-features ${{ matrix.pkgs }} 2>&1 | tee ../probe-out/log/codegen.log
          code=${PIPESTATUS[0]}
          echo "${code}" > ../probe-out/exit/codegen.txt
          echo "codegen exit=${code}"
          exit 0

      - name: "Inspect generated reserved_keywords sources"
        if: always()
        working-directory: baml_language
        timeout-minutes: 5
        run: |
          set +e
          {
            for d in sdk_tests/crates/*/reserved_keywords/generated; do
              [ -d "${d}" ] || continue
              echo "=== ${d} ==="
              find "${d}" -type f \
                -not -path '*/node_modules/*' \
                -not -path '*/.venv/*' \
                -not -path '*/.build/*' | sort
            done
          } | tee ../probe-out/log/generated-tree.txt
          echo "--- swift generated sources: occurrences of 'async' ---" \
            | tee ../probe-out/log/swift-async-grep.txt
          grep -rn --binary-files=without-match -e 'async' \
            sdk_tests/crates/swift/reserved_keywords/generated \
            2>/dev/null | head -200 | tee -a ../probe-out/log/swift-async-grep.txt
          echo "--- build_diagnostics.txt files ---" \
            | tee ../probe-out/log/build-diagnostics.txt
          for f in target/debug/build/sdk_test_*/out/build_diagnostics.txt; do
            [ -f "${f}" ] || continue
            echo "=== ${f} ===" | tee -a ../probe-out/log/build-diagnostics.txt
            cat "${f}" | tee -a ../probe-out/log/build-diagnostics.txt
          done
          exit 0

      - name: "Upload generated sources (pre-test)"
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: generated-pretest-${{ matrix.label }}
          path: |
            probe-out/**
            baml_language/sdk_tests/crates/*/reserved_keywords/generated/**
            baml_language/target/debug/build/sdk_test_*/out/build_diagnostics.txt
          if-no-files-found: warn
          retention-days: 14

      # ---- Priority 1: Swift. macOS is Swift's only CI leg and the
      # reserved_keywords fixture has never run against it. Note the fixture is
      # NOT in ENFORCED_FIXTURES in harness_setup/src/swift.rs, so its test is
      # emitted `#[ignore]`d; `--run-ignored all` is what makes it execute.
      - name: "swift: build_diagnostics (codegen soft-failures)"
        if: always()
        continue-on-error: true
        working-directory: baml_language
        timeout-minutes: 15
        run: |
          set +e
          cargo nextest run -p sdk_test_swift --all-features --no-fail-fast \
            -E 'package(=sdk_test_swift) and test(build_diagnostics)' \
            2>&1 | tee ../probe-out/log/swift-diagnostics.log
          code=${PIPESTATUS[0]}
          echo "${code}" > ../probe-out/exit/swift-diagnostics.txt
          echo "swift-diagnostics exit=${code}"
          exit 0

      - name: "swift: reserved_keywords (macOS only, --run-ignored all)"
        if: always() && matrix.label == 'macos'
        continue-on-error: true
        working-directory: baml_language
        timeout-minutes: 30
        run: |
          set +e
          cargo nextest run -p sdk_test_swift --all-features --no-fail-fast \
            --run-ignored all \
            -E 'package(=sdk_test_swift) and test(reserved_keywords)' \
            2>&1 | tee ../probe-out/log/swift-reserved-keywords.log
          code=${PIPESTATUS[0]}
          echo "${code}" > ../probe-out/exit/swift-reserved-keywords.txt
          echo "swift-reserved-keywords exit=${code}"
          exit 0

      - name: "Upload interim output (after swift)"
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: probe-interim-swift-${{ matrix.label }}
          path: |
            probe-out/**
            baml_language/sdk_tests/crates/swift/reserved_keywords/generated/**
          if-no-files-found: warn
          retention-days: 14

      # ---- Pinned C++ sources. This runs on ALL THREE legs (Option W of the
      # revision 3 design) and sits immediately before the first cell that
      # consumes those sources, because each leg needs it for a different half
      # of the same invariant.
      #   windows: nextest binds `cpp_cdylib_win` -> crates/cpp/setup.ps1 on
      #     cfg(windows), and that script ONLY builds bridge_cffi. Unlike
      #     setup.sh it never pre-clones the pinned protobuf/abseil sources,
      #     while the generated test.sh passes -DFETCHCONTENT_SOURCE_DIR_PROTOBUF
      #     and _ABSL unconditionally, so cmake would be pointed at two
      #     directories that do not exist.
      #   macos + ubuntu: setup.sh does clone them, but its guard is
      #     `[[ -d "$dest" ]] && return 0`, so a directory that exists and is
      #     gutted is accepted. That is how run 31797094469 lost four C++ cells
      #     to exit 105 after rust-cache restored such directories.
      # So the invariant enforced here is "exists AND contains a
      # CMakeLists.txt", and the step reports ABSENT / STALE / VALID rather than
      # assuming. A directory that fails the invariant is MOVED into
      # RUNNER_TEMP, never deleted, so the evidence survives the run.
      # The artifact keys stay `cpp-windows-pinned-src.txt` on every leg on
      # purpose: that is the name the revision 3 design and the reading tables
      # already refer to, and each leg uploads its own probe-out/, so there is
      # no collision between legs.
      - name: "pinned cpp sources, all legs (exists AND valid, not just exists)"
        if: always()
        working-directory: baml_language
        timeout-minutes: 8
        run: |
          set +e
          mkdir -p ../probe-out/exit ../probe-out/log target
          out=../probe-out/log/cpp-windows-pinned-src.txt
          : > "${out}"
          # Pins live in sdk_tests/crates/cpp/setup.sh; drift is reported, not guessed.
          PB_TAG=v31.1
          ABSL_TAG=20250127.0
          grep -q "protobuf.git ${PB_TAG}" sdk_tests/crates/cpp/setup.sh \
            || echo "WARN: protobuf pin drift vs setup.sh" | tee -a "${out}"
          grep -q "abseil-cpp.git ${ABSL_TAG}" sdk_tests/crates/cpp/setup.sh \
            || echo "WARN: abseil pin drift vs setup.sh" | tee -a "${out}"
          rc=0
          ensure_pinned() {
            repo="$1"; tag="$2"; dest="$3"
            if [ -d "${dest}" ]; then
              if [ -f "${dest}/CMakeLists.txt" ]; then
                echo "VALID    ${dest} (pre-existing)" | tee -a "${out}"
                return 0
              fi
              echo "STALE    ${dest} (no CMakeLists.txt), moving aside" | tee -a "${out}"
              mv "${dest}" "${RUNNER_TEMP}/stale-$(basename "${dest}")-$$" \
                || { echo "MOVE FAILED ${dest}" | tee -a "${out}"; return 1; }
            else
              echo "ABSENT   ${dest}" | tee -a "${out}"
            fi
            echo "CLONE    ${repo} @ ${tag}" | tee -a "${out}"
            git clone --quiet --depth 1 --branch "${tag}" "${repo}" "${dest}.tmp.$$" >> "${out}" 2>&1 \
              || { echo "CLONE FAILED ${repo}" | tee -a "${out}"; return 1; }
            mv "${dest}.tmp.$$" "${dest}" \
              || { echo "RENAME FAILED ${dest}" | tee -a "${out}"; return 1; }
            [ -f "${dest}/CMakeLists.txt" ] \
              || { echo "INVALID AFTER CLONE ${dest}" | tee -a "${out}"; return 1; }
            echo "VALID    ${dest} (freshly cloned)" | tee -a "${out}"
          }
          ensure_pinned https://github.com/protocolbuffers/protobuf.git \
            "${PB_TAG}" target/cpp-protobuf-src || rc=1
          ensure_pinned https://github.com/abseil/abseil-cpp.git \
            "${ABSL_TAG}" target/cpp-absl-src || rc=1
          echo "${rc}" > ../probe-out/exit/cpp-windows-pinned-src.txt
          cat "${out}"
          exit 0

      # ---- C++ (macOS + ubuntu). Windows gets a separate best-effort step at
      # the very end: upstream's own matrix excludes cpp on Windows because the
      # fixture driver is bash + POSIX cmake.
      - name: "cpp: reserved_keywords"
        if: always() && matrix.label != 'windows'
        continue-on-error: true
        working-directory: baml_language
        timeout-minutes: 30
        run: |
          set +e
          cargo nextest run -p sdk_test_cpp --all-features --no-fail-fast \
            -E 'package(=sdk_test_cpp) and test(reserved_keywords)' \
            2>&1 | tee ../probe-out/log/cpp.log
          code=${PIPESTATUS[0]}
          echo "${code}" > ../probe-out/exit/cpp.txt
          echo "cpp exit=${code}"
          exit 0

      - name: "typescript: reserved_keywords"
        if: always()
        continue-on-error: true
        working-directory: baml_language
        timeout-minutes: 35
        run: |
          set +e
          cargo nextest run -p sdk_test_typescript --all-features --no-fail-fast \
            -E 'package(=sdk_test_typescript) and test(reserved_keywords)' \
            2>&1 | tee ../probe-out/log/typescript.log
          code=${PIPESTATUS[0]}
          echo "${code}" > ../probe-out/exit/typescript.txt
          echo "typescript exit=${code}"
          exit 0

      - name: "typescript_web: reserved_keywords"
        if: always()
        continue-on-error: true
        working-directory: baml_language
        timeout-minutes: 25
        run: |
          set +e
          cargo nextest run -p sdk_test_typescript_web --all-features --no-fail-fast \
            -E 'package(=sdk_test_typescript_web) and test(reserved_keywords)' \
            2>&1 | tee ../probe-out/log/typescript-web.log
          code=${PIPESTATUS[0]}
          echo "${code}" > ../probe-out/exit/typescript-web.txt
          echo "typescript-web exit=${code}"
          exit 0

      - name: "rust: reserved_keywords"
        if: always()
        continue-on-error: true
        working-directory: baml_language
        timeout-minutes: 25
        run: |
          set +e
          cargo nextest run -p sdk_test_rust --all-features --no-fail-fast \
            -E 'package(=sdk_test_rust) and test(reserved_keywords)' \
            2>&1 | tee ../probe-out/log/rust.log
          code=${PIPESTATUS[0]}
          echo "${code}" > ../probe-out/exit/rust.txt
          echo "rust exit=${code}"
          exit 0

      # All three legs as of revision 2. macOS was the one genuine gap against
      # upstream's matrix, which does schedule python-pydantic2 on macos.
      - name: "python_pydantic2: reserved_keywords"
        if: always()
        continue-on-error: true
        working-directory: baml_language
        timeout-minutes: 25
        run: |
          set +e
          cargo nextest run -p sdk_test_python_pydantic2 --all-features --no-fail-fast \
            -E 'package(=sdk_test_python_pydantic2) and test(reserved_keywords)' \
            2>&1 | tee ../probe-out/log/python-pydantic2.log
          code=${PIPESTATUS[0]}
          echo "${code}" > ../probe-out/exit/python-pydantic2.txt
          echo "python-pydantic2 exit=${code}"
          exit 0

      # Windows only, and this is the measured blocker from run 31797094469.
      # The fixture driver is spawned as Command::new("bash") from the nextest
      # test binary. rustc 1.93.0's own resolver
      # (library/std/src/sys/process/windows.rs, fn search_paths) searches, in
      # order: (1) a PATH set explicitly on the Command, which the harness never
      # sets; (2) the directory of current_exe(); (3) GetSystemDirectory(), i.e.
      # C:\Windows\System32, where the WSL launcher lives; (4)
      # GetWindowsDirectory(); (5) the inherited PATH. Run 31797094469 measured
      # 3 beating 5 with Git Bash already first on PATH, which is why no PATH
      # ordering can help. But 2 beats 3, and 2 is the test binary's own
      # directory, target/debug/deps. So this step builds a small native
      # launcher named bash.exe there. The launcher forwards argv to the real
      # Git Bash by absolute path, so Git Bash runs from its own installation
      # with its own msys root: nothing is copied out of it, and nothing on the
      # runner is modified. A canary compiled into the same directory measures
      # the resolution before and after. The AFTER canary is the gate: if it
      # does not show an MSYS/MINGW shell, the C++ result below is UNKNOWN and
      # must not be read as a verdict on the code.
      - name: "windows: make native children resolve Git Bash (canary + launcher)"
        if: always() && matrix.label == 'windows'
        working-directory: baml_language
        timeout-minutes: 5
        run: |
          set +e
          mkdir -p ../probe-out/exit ../probe-out/log
          out=../probe-out/log/cpp-windows-bashfix.txt
          : > "${out}"
          deps="$(pwd)/target/debug/deps"
          work="${RUNNER_TEMP}/bashfix"
          mkdir -p "${deps}" "${work}"

          cat > "${work}/bashprobe.rs" <<'PROBE_EOF'
          use std::process::Command;
          fn main() {
              println!("probe_exe: {}", std::env::current_exe().unwrap().display());
              let r = Command::new("bash")
                  .arg("-c")
                  .arg("echo BASH_RESOLVED_OK; uname -s")
                  .output();
              match r {
                  Ok(o) => {
                      println!("code: {:?}", o.status.code());
                      println!("stdout: {}", String::from_utf8_lossy(&o.stdout));
                      println!("stderr: {}", String::from_utf8_lossy(&o.stderr));
                  }
                  Err(e) => println!("spawn_error: {e}"),
              }
          }
          PROBE_EOF
          rustc -O "${work}/bashprobe.rs" -o "${deps}/bashprobe.exe" >> "${out}" 2>&1
          echo "rustc bashprobe exit=$?" >> "${out}"
          "${deps}/bashprobe.exe" > ../probe-out/log/cpp-windows-canary-before.txt 2>&1
          echo "--- canary BEFORE (expected: the WSL launcher, the failure of record) ---" >> "${out}"
          cat ../probe-out/log/cpp-windows-canary-before.txt >> "${out}"

          gitwin=""
          if [ -n "${GIT_BASH_DIR:-}" ] && [ -f "${GIT_BASH_DIR}/bash.exe" ]; then
            gitwin="$(cygpath -w "${GIT_BASH_DIR}/bash.exe")"
          fi
          echo "git bash (windows form): ${gitwin:-<none>}" >> "${out}"
          fixrc=1
          if [ -n "${gitwin}" ]; then
            {
              echo 'use std::process::{Command, exit};'
              echo 'fn main() {'
              printf '    let real = r"%s";\n' "${gitwin}"
              echo '    let args: Vec<std::ffi::OsString> = std::env::args_os().skip(1).collect();'
              echo '    match Command::new(real).args(&args).status() {'
              echo '        Ok(s) => exit(s.code().unwrap_or(1)),'
              echo '        Err(e) => { eprintln!("bash launcher failed: {e}"); exit(127); }'
              echo '    }'
              echo '}'
            } > "${work}/bashlauncher.rs"
            rustc -O "${work}/bashlauncher.rs" -o "${deps}/bash.exe" >> "${out}" 2>&1
            fixrc=$?
            echo "rustc bashlauncher exit=${fixrc}" >> "${out}"
          fi
          if [ "${fixrc}" = 0 ]; then
            "${deps}/bash.exe" -c 'echo LAUNCHER_OK; uname -s' >> "${out}" 2>&1
            st=$?
            "${deps}/bash.exe" -c 'exit 42' >> "${out}" 2>&1
            st42=$?
            echo "launcher self-test exit=${st} (want 0), passthrough=${st42} (want 42)" >> "${out}"
            if [ "${st}" != 0 ] || [ "${st42}" != 42 ]; then fixrc=1; fi
          fi
          if [ "${fixrc}" != 0 ]; then
            echo "--- launcher unusable; fallback: move the System32 WSL launcher aside ---" >> "${out}"
            mv "${deps}/bash.exe" "${work}/bash.exe.rejected" >> "${out}" 2>&1
            cmd //c "takeown /f C:\Windows\System32\bash.exe" >> "${out}" 2>&1
            cmd //c "icacls C:\Windows\System32\bash.exe /grant *S-1-5-32-544:F" >> "${out}" 2>&1
            mv /c/Windows/System32/bash.exe /c/Windows/System32/bash.exe.wsl-aside >> "${out}" 2>&1
            if [ -f /c/Windows/System32/bash.exe ]; then
              echo "fallback FAILED: System32 bash.exe still present" >> "${out}"
            else
              echo "fallback APPLIED: System32 bash.exe moved aside" >> "${out}"
            fi
          fi

          "${deps}/bashprobe.exe" > ../probe-out/log/cpp-windows-canary-after.txt 2>&1
          echo "--- canary AFTER (this is the gate) ---" >> "${out}"
          cat ../probe-out/log/cpp-windows-canary-after.txt >> "${out}"
          if grep -q "BASH_RESOLVED_OK" ../probe-out/log/cpp-windows-canary-after.txt \
             && grep -Eq "MINGW|MSYS|CYGWIN" ../probe-out/log/cpp-windows-canary-after.txt; then
            echo "0" > ../probe-out/exit/cpp-windows-bashfix.txt
          else
            echo "1" > ../probe-out/exit/cpp-windows-bashfix.txt
          fi
          cat "${out}"
          exit 0

      # Last, and still a BONUS rather than a gap: upstream has no Windows cpp
      # entry at all, and the comment in cargo-tests.reusable.yaml says Windows
      # joins "once the MSVC test driver lands". Revision 1 never reached C++
      # here; it died in 0.24s because `bash` resolved to the WSL launcher.
      # Revision 2 put Git Bash first on PATH and MEASURED that this changes
      # nothing for a native child (System32 is searched before PATH).
      # Revision 3 fixes the resolution at the position that actually decides
      # it, two steps above, and gates this cell on the canary.
      #
      # What can still fail here for reasons that are NOT the patch under
      # review, and how the logs tell them apart:
      #   - bash still unresolved: cpp-windows-bashfix.txt = 1. Then this cell
      #     is UNKNOWN, not a failure of the code.
      #   - pinned sources missing or invalid: cpp-windows-pinned-src.txt = 1,
      #     and cpp-windows-cmake.log shows a FetchContent or add_subdirectory
      #     error naming cpp-protobuf-src / cpp-absl-src.
      #   - toolchain: "No CMAKE_CXX_COMPILER could be found" in configure.log.
      #   - a compile error inside cpp-protobuf-src / cpp-absl-src sources is a
      #     dependency or toolchain result, not a codegen result.
      # Only a compiler error naming files under
      # sdk_tests/crates/cpp/reserved_keywords/generated/baml_sdk/ is a real
      # result about the code under review.
      #
      # Note on the exec path: this fixture has no customizable/tests/*.cc
      # (measured from run 31695117485's generated tree, which lists only
      # baml_sdk/** and test.sh), so test.sh takes its HAVE_TESTS=0 branch and
      # never execs "$BUILD_DIR/build/fixture_tests". Both cells therefore
      # measure compilation of the generated SDK, on every platform equally.
      # The contingency block below exists only in case that reading is wrong.
      - name: "cpp on windows (native-child bash resolved; bonus, not a gap)"
        if: always() && matrix.label == 'windows'
        continue-on-error: true
        working-directory: baml_language
        timeout-minutes: 40
        run: |
          set +e
          mkdir -p ../probe-out/exit ../probe-out/log
          if [ -n "${GIT_BASH_DIR:-}" ]; then
            export PATH="${GIT_BASH_DIR}:${PATH}"
          fi
          {
            echo "GIT_BASH_DIR=${GIT_BASH_DIR:-<unset>}"
            echo "--- where.exe bash (PATH order; NOT what a native child uses) ---"
            where.exe bash 2>&1
            echo "--- launcher next to the test binary (what a native child uses) ---"
            ls -l target/debug/deps/bash.exe 2>&1
            echo "--- native-child canary verdict (0 = resolved to a real shell) ---"
            cat ../probe-out/exit/cpp-windows-bashfix.txt 2>&1
          } | tee ../probe-out/log/cpp-windows-bash.txt

          cargo nextest run -p sdk_test_cpp --all-features --no-fail-fast \
            -E 'package(=sdk_test_cpp) and test(reserved_keywords)' \
            2>&1 | tee ../probe-out/log/cpp-windows.log
          code=${PIPESTATUS[0]}
          echo "${code}" > ../probe-out/exit/cpp-windows.txt
          echo "cpp-windows exit=${code}"

          find target/cpp-fixture-builds -maxdepth 4 2>/dev/null | sort | head -400 \
            > ../probe-out/log/cpp-windows-buildtree-pass1.txt

          # Contingency for the multi-config layout, and ONLY a contingency:
          # if the run cell somehow did reach the exec, the default generator on
          # windows-latest is multi-config and writes build/<Config>/*.exe while
          # the driver execs build/fixture_tests. This block measures the tree
          # first and acts only if such a binary is actually there.
          shimmed=0
          if [ "${code}" != 0 ]; then
            for t in target/cpp-fixture-builds/*-run/build; do
              [ -d "${t}" ] || continue
              for b in "${t}"/*/fixture_tests.exe "${t}"/*/fixture_tests_cxx20.exe; do
                [ -f "${b}" ] || continue
                dst="${t}/$(basename "${b}")"
                if [ ! -f "${dst}" ]; then
                  cp "${b}" "${dst}" && shimmed=1
                  echo "layout shim: ${b} -> ${dst}" \
                    >> ../probe-out/log/cpp-windows-runlayout.txt
                fi
              done
            done
          fi
          echo "${shimmed}" > ../probe-out/exit/cpp-windows-layout-shim.txt
          if [ "${shimmed}" = 1 ]; then
            cargo nextest run -p sdk_test_cpp --all-features --no-fail-fast \
              -E 'package(=sdk_test_cpp) and test(reserved_keywords::run)' \
              2>&1 | tee ../probe-out/log/cpp-windows-pass2.log
            echo "${PIPESTATUS[0]}" > ../probe-out/exit/cpp-windows-pass2.txt
          fi

          # cmake's own logs, whatever happened, so a compiler error can be told
          # apart from a missing-shell or wrong-output-path error.
          for f in target/cpp-fixture-builds/reserved_keywords-*/configure.log \
                   target/cpp-fixture-builds/reserved_keywords-*/build.log; do
            [ -f "${f}" ] || continue
            echo "=== ${f} ===" >> ../probe-out/log/cpp-windows-cmake.log
            cat "${f}" >> ../probe-out/log/cpp-windows-cmake.log
          done
          find target/cpp-fixture-builds -maxdepth 4 2>/dev/null | sort | head -400 \
            > ../probe-out/log/cpp-windows-buildtree.txt
          exit 0

      - name: "Exit codes (read back from files)"
        if: always()
        timeout-minutes: 5
        run: |
          set +e
          {
            echo "### probe (${{ matrix.label }} / ${{ matrix.os }})"
            echo ""
            echo '```'
            for f in probe-out/exit/*.txt; do
              [ -f "${f}" ] || continue
              name="$(basename "${f}" .txt)"
              printf '%-28s %s\n' "${name}" "$(cat "${f}")"
            done
            echo '```'
            echo ""
            echo '```'
            cat probe-out/platform.txt
            echo '```'
          } | tee probe-out/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
          cat probe-out/SUMMARY.md
          exit 0

      - name: "Upload probe output (post-test)"
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: probe-posttest-${{ matrix.label }}
          path: |
            probe-out/**
            baml_language/sdk_tests/crates/*/reserved_keywords/generated/**
            baml_language/target/nextest/**
            baml_language/target/debug/build/sdk_test_*/out/build_diagnostics.txt
            !baml_language/sdk_tests/crates/*/reserved_keywords/generated/**/node_modules/**
            !baml_language/sdk_tests/crates/*/reserved_keywords/generated/**/target/**
          if-no-files-found: warn
          retention-days: 14
